<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prijava</title>
  <link rel="stylesheet" href="auth.css?v=20260830-1">
</head>
<body class="auth-page">

  <div class="auth-shell">
    <a class="auth-top-link" href="index.html">← Natrag na početnu</a>

    <div class="auth-card">
      <div class="auth-logo">GBAutoCare</div>
      <h1 class="auth-title">Prijava</h1>
      <p class="auth-subtitle">
        Prijavi se i automatski popuni rezervacijsku formu svojim podacima.
      </p>

<form id="login-form" class="auth-form">
        <input type="email" id="login-email" placeholder="Email adresa" required>
        
        <div style="position: relative;">
            <input type="password" id="login-password" placeholder="Lozinka" style="margin-bottom: 0;" required>
            <span class="toggle-password" onclick="togglePassword('login-password', this)">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </span>
        </div>
        
        <button type="submit" class="auth-btn" style="margin-top: 4px;">Prijavi se</button>
      </form>

      <p class="auth-privacy">
        Podaci za prijavu obrađuju se radi pristupa vašem računu.
        Pročitajte <a href="privatnost.html" target="_blank" rel="noopener">Pravila privatnosti</a>.
      </p>
      
      <p id="login-message" class="auth-message"></p>

      <div class="auth-links">
        Nemaš račun? <a href="register.html">Registriraj se</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
